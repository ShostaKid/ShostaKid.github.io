name: Giữ Supabase không ngủ

# Gói Free tự tạm dừng project sau khoảng 7 ngày không có request nào.
# Trang Works, trang đọc và cả form đăng bài giờ đều phụ thuộc Supabase,
# nên để nó ngủ là site mất danh sách truyện (lùi về fics.json) và mất luôn
# nội dung chương của những truyện đăng qua form.
#
# Chạy 3 ngày một lần — đủ thưa để không phí, đủ dày để không bao giờ chạm mốc 7 ngày.
on:
  schedule:
    - cron: '17 4 */3 * *'   # 04:17 UTC, cách 3 ngày
  workflow_dispatch: {}      # cho phép bấm chạy tay trên GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi một request nhẹ tới Supabase
        env:
          # Đây là publishable key, vốn đã nằm công khai trong index.html —
          # không phải bí mật. Để lộ ở đây cũng không thêm rủi ro nào.
          SB_URL: https://oseddxgmwbeduazbomuf.supabase.co
          SB_KEY: sb_publishable_aOYL383Vt2fI561c0VJqbg_VDcuKqUe
        run: |
          set -euo pipefail
          # head=true + limit=1: chỉ hỏi số lượng, không kéo dữ liệu về.
          ma=$(curl -s -o /tmp/kq -w '%{http_code}' \
                 -H "apikey: $SB_KEY" \
                 -H "Authorization: Bearer $SB_KEY" \
                 -H "Prefer: count=exact" \
                 -H "Range: 0-0" \
                 "$SB_URL/rest/v1/works?select=id&status=eq.published")
          echo "HTTP $ma"
          head -c 200 /tmp/kq || true
          echo
          # 200 hoặc 206 đều là bình thường (206 vì có header Range).
          if [ "$ma" != "200" ] && [ "$ma" != "206" ]; then
            echo "::error::Supabase trả về $ma — project có thể đã bị tạm dừng hoặc key đã đổi."
            exit 1
          fi
          echo "Supabase còn thức."
